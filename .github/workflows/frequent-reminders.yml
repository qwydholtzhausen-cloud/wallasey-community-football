name: Frequent reminders

on:
  # The schedule moved to Supabase on 2026-09-27 (pg_cron + pg_net call
  # /api/cron/frequent every 5 minutes, on time). GitHub ran this "every
  # 15 minutes" late and irregularly, which is why kickoff reminders were
  # being missed. Kept as a manual backup: Actions -> Frequent reminders
  # -> Run workflow.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call frequent-reminders endpoint
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/frequent" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
